<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="400" height="400" rx="88" fill="#141110"/>

  <!-- M mark, centered -->
  <g>
    <!-- left vertical + start of first diagonal (off-white) -->
    <path d="M110,305 L110,95 L155,162.5"
          fill="none" stroke="#F4EFE4" stroke-width="50"
          stroke-linecap="butt" stroke-linejoin="miter"/>

    <!-- accent cut: red spark, rounded -->
    <path d="M155,162.5 L168.5,182.75"
          fill="none" stroke="#E4362A" stroke-width="50"
          stroke-linecap="round"/>

    <!-- rest of diagonal + right peak + right vertical (off-white) -->
    <path d="M168.5,182.75 L200,230 L290,95 L290,305"
          fill="none" stroke="#F4EFE4" stroke-width="50"
          stroke-linecap="butt" stroke-linejoin="miter"/>

    <!-- red dot -->
    <circle cx="252" cy="145" r="12" fill="#E4362A"/>
  </g>
</svg>
