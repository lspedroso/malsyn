<svg viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="400" height="480" fill="#141110"/>

  <!-- M mark -->
  <g>
    <!-- left vertical + start of first diagonal (cream) -->
    <path d="M110,310 L110,100 L155,167.5"
          fill="none" stroke="#F4EFE4" stroke-width="50"
          stroke-linecap="butt" stroke-linejoin="miter"/>

    <!-- accent cut: coral spark -->
    <path d="M155,167.5 L168.5,187.75"
          fill="none" stroke="#FF6B47" stroke-width="50"
          stroke-linecap="butt"/>

    <!-- rest of diagonal + right peak + right vertical (cream) -->
    <path d="M168.5,187.75 L200,235 L290,100 L290,310"
          fill="none" stroke="#F4EFE4" stroke-width="50"
          stroke-linecap="butt" stroke-linejoin="miter"/>
  </g>

  <!-- wordmark -->
  <text x="200" y="430" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="40" letter-spacing="8"
        fill="#F4EFE4">MALSYN</text>
</svg>
